[project]
name = "nxtheme_creator"
version = "2025"
description = "Tool for making custom Nintendo Switch themes using `SwitchThemes.exe` with images, and a simple config"
authors = [{ name = "FredHappyface" }]
requires-python = ">=3.9"
readme = "README.md"
license = "gpl-2.0-or-later"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "oead>=1.2.9.post4",
    "pillow>=10.4.0",
    "sarc>=2.0.5",
]

[project.urls]
Homepage = "https://github.com/FHPythonUtils/nxtheme-creator"
Repository = "https://github.com/FHPythonUtils/nxtheme-creator"
Documentation = "https://github.com/FHPythonUtils/nxtheme-creator/blob/master/README.md"

[project.scripts]
nxtheme_creator = "nxtheme_creator:cli"

[dependency-groups]
dev = [
    "coverage>=7.9.2",
    "handsdown>=2.1.0",
    "imgcompare>=2.0.1",
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "ruff>=0.12.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py38"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
	"ANN101",  # type annotation for self in method
	"COM812",  # enforce trailing comma
	"D2",  # pydocstyle formatting
	"ISC001",
	"N",  # pep8 naming
	"PLR09",  # pylint refactor too many
	"TCH",  # type check blocks
	"W191"  # ignore this to allow tabs
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/{tests,docs,tools}/*" = ["D", "S101", "E402"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all" # Disallow all relative imports.

[tool.ruff.format]
indent-style = "tab"
docstring-code-format = true
line-ending = "lf"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.tox]
legacy_tox_ini = """
[tox]
env_list =
	py311
	py310
	py39
	py38

[testenv]
deps =
	pytest
	imgcompare
commands = pytest tests
"""
